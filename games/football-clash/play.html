<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#071408" />
  <title>Football Clash</title>
  <link rel="stylesheet" href="/shared/mobile-shell.css" />
  <link rel="stylesheet" href="/football-clash/football-clash.css" />
</head>
<body>
  <div class="gm-shell gm-shell--football-clash">
    <div class="fc-backdrop" id="fc-backdrop" aria-hidden="true"></div>

    <div class="fc-sheet">
      <div class="fc-handle" aria-hidden="true"></div>

      <div class="fc" id="app">
        <header class="fc-top">
          <div class="fc-round">Match <span id="round-id">—</span></div>
          <div class="fc-wallet">
            <span class="fc-wallet__coin" aria-hidden="true"></span>
            <span id="balance">0</span>
          </div>
        </header>

        <main class="fc-stage">
          <div class="fc-status" id="phase-chip">Pick your prediction</div>

          <div class="fc-timer-wrap">
            <svg class="fc-timer-ring" viewBox="0 0 88 88" aria-hidden="true">
              <circle class="fc-timer-ring__track" cx="44" cy="44" r="38" />
              <circle class="fc-timer-ring__fill" id="timer-ring" cx="44" cy="44" r="38" />
            </svg>
            <div class="fc-timer" id="countdown">15</div>
          </div>

          <div class="fc-stadium-card">
            <canvas id="fc-stadium" class="fc-stadium-canvas" aria-label="Live match"></canvas>
            <div class="fc-goal-overlay" id="goal-overlay" hidden aria-hidden="true">
              <span class="fc-goal-overlay__text">GOAL!</span>
              <span class="fc-goal-overlay__cheer" aria-hidden="true">🎉 👏 ⚽</span>
            </div>
          </div>

          <div class="fc-commentary" id="events" aria-live="polite"></div>
        </main>

        <footer class="fc-foot">
          <button type="button" class="fc-history" id="btn-history" aria-label="View recent results">
            <span class="fc-history__new">NEW</span>
            <div class="fc-history__dots" id="history-bar"></div>
            <span class="fc-history__chev" aria-hidden="true">›</span>
          </button>
          <div class="fc-pick">
            <button type="button" class="fc-pick__btn" data-pred="home">
              <div class="fc-pick__face">
                <img src="" alt="" class="fc-pick__flag" id="pick-flag-home" />
                <small>×1.92</small>
              </div>
              <span class="fc-pick__amt" data-amt>0</span>
            </button>
            <button type="button" class="fc-pick__btn" data-pred="draw">
              <div class="fc-pick__face">
                <img src="/football-clash/assets/flag-draw.svg" alt="Draw" class="fc-pick__flag" />
                <small>×3.5</small>
              </div>
              <span class="fc-pick__amt" data-amt>0</span>
            </button>
            <button type="button" class="fc-pick__btn" data-pred="away">
              <div class="fc-pick__face">
                <img src="" alt="" class="fc-pick__flag" id="pick-flag-away" />
                <small>×1.92</small>
              </div>
              <span class="fc-pick__amt" data-amt>0</span>
            </button>
          </div>
          <div class="fc-foot-row">
            <div class="fc-chips" id="chips"></div>
            <button type="button" class="fc-rebet" id="btn-repeat" title="Repeat last bet">Repeat</button>
          </div>
        </footer>

        <div class="fc-fx" id="fc-fx" aria-hidden="true"></div>

        <div class="fc-result" id="result-popup" hidden>
          <button type="button" class="fc-result__backdrop" id="result-backdrop" aria-label="Close"></button>
          <div class="fc-result__card" id="result-card">
            <div class="fc-result__shimmer" aria-hidden="true"></div>
            <div class="fc-result__flag-wrap">
              <img id="result-flag" class="fc-result__flag" alt="" />
            </div>
            <h2 class="fc-result__title" id="result-title">Full Time</h2>
            <p class="fc-result__score" id="result-score"></p>
            <div class="fc-result__bet">
              <div>Bet placed: <strong id="result-bet-amt">0</strong></div>
              <div>You win: <strong id="result-win-amt">0</strong></div>
            </div>
            <button type="button" class="fc-result__ok" id="result-ok">OK</button>
          </div>
        </div>

        <div class="fc-history-modal" id="history-modal" hidden>
          <button type="button" class="fc-history-modal__backdrop" id="history-backdrop" aria-label="Close"></button>
          <div class="fc-history-modal__sheet" role="dialog" aria-labelledby="history-title">
            <div class="fc-history-modal__head">
              <h2 class="fc-history-modal__title" id="history-title">Recent results</h2>
              <button type="button" class="fc-history-modal__close" id="history-close" aria-label="Close">✕</button>
            </div>
            <div class="fc-history-modal__body">
              <div class="fc-history-grid" id="history-grid"></div>
            </div>
          </div>
        </div>

        <div class="fc-toast" id="toast" hidden></div>
      </div>
    </div>
  </div>
  <script type="module" src="/football-clash/football-clash.js"></script>
</body>
</html>
