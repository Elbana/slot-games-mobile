<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1528" />
  <title>Lucky 77</title>
  <link rel="stylesheet" href="/shared/mobile-shell.css" />
  <link rel="stylesheet" href="/lottery/lucky77/lucky77.css" />
</head>
<body>
  <div class="gm-shell gm-shell--lucky77">
    <div class="l77" id="app">
      <header class="l77-header">
        <div class="l77-header__left">
          <a class="l77-icon-btn" href="/" title="Home">⌂</a>
          <button type="button" class="l77-icon-btn" id="btn-rank" title="Rank">🏆</button>
        </div>
        <div class="l77-header__center">
          <span class="l77-round" id="round-label">Round --</span>
        </div>
        <div class="l77-header__right">
          <span class="l77-players" id="players-count">👤 1</span>
          <button type="button" class="l77-icon-btn" id="btn-menu" title="Menu">☰</button>
        </div>
      </header>

      <main class="l77-stage">
        <div class="l77-statue l77-statue--left" aria-hidden="true"></div>
        <div class="l77-statue l77-statue--right" aria-hidden="true"></div>
        <div class="l77-wheel-wrap">
          <div class="l77-wheel-ring" aria-hidden="true"></div>
          <canvas id="wheel-canvas" width="600" height="600" aria-label="Lucky 77 wheel"></canvas>
          <img class="l77-pointer" id="asset-pointer" src="" alt="" aria-hidden="true" />
          <div class="l77-wheel-hub">
            <span class="l77-wheel-count" id="countdown" aria-live="polite">10</span>
          </div>
        </div>
      </main>

      <section class="l77-history">
        <span class="l77-history__new">NEW</span>
        <div class="l77-history__dots" id="history"></div>
      </section>

      <section class="l77-bets" id="bet-zones">
        <button type="button" class="l77-bet l77-bet--lemon" data-code="LUCK77_LEMON">
          <div class="l77-bet__icon"><img data-l77-symbol="lemon" src="" alt="" /></div>
          <span class="l77-bet__odd">×2</span>
          <span class="l77-bet__amt" data-amt>0</span>
        </button>
        <button type="button" class="l77-bet l77-bet--seven" data-code="LUCK77_SEVEN">
          <div class="l77-bet__icon"><img data-l77-symbol="seven" src="" alt="" /></div>
          <span class="l77-bet__odd">×8</span>
          <span class="l77-bet__amt" data-amt>0</span>
        </button>
        <button type="button" class="l77-bet l77-bet--melon" data-code="LUCK77_WATERMELON">
          <div class="l77-bet__icon"><img data-l77-symbol="melon" src="" alt="" /></div>
          <span class="l77-bet__odd">×2</span>
          <span class="l77-bet__amt" data-amt>0</span>
        </button>
      </section>

      <section class="l77-chips" id="chips"></section>

      <footer class="l77-footer">
        <div class="l77-footer__user">
          <span class="l77-footer__name" id="player-name">Player</span>
          <div class="l77-footer__balance">
            <img class="l77-coin" id="asset-coin" src="" alt="" />
            <span id="balance">0</span>
            <button type="button" class="l77-plus" id="btn-topup" title="Top up">+</button>
          </div>
        </div>
        <button type="button" class="l77-rebet" id="btn-rebet" title="Re-bet last round">↻</button>
      </footer>

      <div class="l77-toast" id="toast"></div>
      <div class="l77-win" id="win-overlay" hidden>
        <div class="l77-win__card">
          <div class="l77-win__title" id="win-title">You won!</div>
          <div class="l77-win__amount" id="win-amount">+0</div>
          <button type="button" class="l77-win__close" id="win-close">OK</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/lottery/lucky77/lucky77.js"></script>
</body>
</html>
